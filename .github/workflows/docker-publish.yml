name: Build and publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: app
            image: e-shuri-app
            build_args: |
              VITE_API_URL=http://api.eshuri.185-137-122-54.sslip.io:8880/api/v1
          - dir: website
            image: e-shuri-website
            build_args: |
              VITE_APP_URL=http://app.eshuri.185-137-122-54.sslip.io:8880
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-infra:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Hirwa-Ghislain/my-dev-cluster
          token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          path: infra-repo

      - name: Bump pinned image tags
        working-directory: infra-repo
        run: |
          sed -i -E 's/^(\s*tag:\s*")[^"]+("\s*#.*)?$/\1${{ github.sha }}\2/' \
            infra/charts/e-shuri-app/values.yaml \
            infra/charts/e-shuri-website/values.yaml
          git config user.name "e-shuri-frontend-ci"
          git config user.email "e-shuri-frontend-ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "No tag change, nothing to commit."
            exit 0
          fi
          git add infra/charts/e-shuri-app/values.yaml infra/charts/e-shuri-website/values.yaml
          git commit -m "chore(e-shuri-app,e-shuri-website): deploy ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest infra main (attempt $i)..."
            git pull --rebase origin main
          done
          echo "Failed to push infra bump after retries" >&2
          exit 1
